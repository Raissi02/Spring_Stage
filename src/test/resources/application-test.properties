# =====================================================================
# Profil "test" : base MySQL dediee aux tests d'integration.
# Prerequis : MySQL demarre (XAMPP) sur localhost:3306, root sans mot de passe.
# La base est creee automatiquement ; le schema est gere par Hibernate.
# =====================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/springJpaStagesTest?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
