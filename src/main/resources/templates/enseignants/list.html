<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}"
      lang="fr">
<head>
    <title>Enseignants</title>
</head>
<body>
<div layout:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Enseignants</h1>
        <a class="btn btn-primary" th:href="@{/enseignants/new}">Nouvel enseignant</a>
    </div>

    <form class="row g-2 mb-3" method="get" th:action="@{/enseignants}">
        <div class="col-sm-5 col-md-4">
            <input class="form-control" type="text" name="motCle" th:value="${motCle}"
                   placeholder="Nom, prenom ou specialite">
        </div>
        <div class="col-auto">
            <button class="btn btn-outline-secondary">Rechercher</button>
        </div>
    </form>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Enseignant</th>
                    <th>Email</th>
                    <th>Grade</th>
                    <th>Specialite</th>
                    <th class="text-center">Etudiants encadres</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="e : ${enseignants}">
                    <td><a th:href="@{/enseignants/{id}(id=${e.id})}" th:text="${e.nomComplet}">Nom</a></td>
                    <td th:text="${e.email}">email</td>
                    <td th:text="${e.grade}">Grade</td>
                    <td th:text="${e.specialite}">Specialite</td>
                    <td class="text-center" th:text="${e.etudiants.size()}">0</td>
                    <td class="text-end text-nowrap">
                        <a class="btn btn-sm btn-outline-secondary"
                           th:href="@{/enseignants/{id}/edit(id=${e.id})}">Modifier</a>
                        <form class="d-inline" method="post"
                              th:action="@{/enseignants/{id}/delete(id=${e.id})}"
                              onsubmit="return confirm('Supprimer cet enseignant ?');">
                            <button class="btn btn-sm btn-outline-danger">Supprimer</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(enseignants)}">
                    <td colspan="6" class="text-center text-muted py-4">Aucun enseignant trouve.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
</body>
</html>
