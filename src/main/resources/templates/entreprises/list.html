<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}"
      lang="fr">
<head>
    <title>Entreprises</title>
</head>
<body>
<div layout:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Entreprises d'accueil</h1>
        <a class="btn btn-primary" th:href="@{/entreprises/new}">Nouvelle entreprise</a>
    </div>

    <form class="row g-2 mb-3" method="get" th:action="@{/entreprises}">
        <div class="col-sm-5 col-md-4">
            <input class="form-control" type="text" name="motCle" th:value="${motCle}"
                   placeholder="Raison sociale">
        </div>
        <div class="col-auto">
            <button class="btn btn-outline-secondary">Rechercher</button>
        </div>
    </form>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Raison sociale</th>
                    <th>Secteur</th>
                    <th>Contact</th>
                    <th>Email</th>
                    <th>Adresse</th>
                    <th class="text-center">Stages</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="e : ${entreprises}">
                    <td th:text="${e.raisonSociale}">Entreprise</td>
                    <td th:text="${e.secteur}">Secteur</td>
                    <td th:text="${e.contactNom}">Contact</td>
                    <td th:text="${e.email}">email</td>
                    <td th:text="${e.adresse}">adresse</td>
                    <td class="text-center" th:text="${e.stages.size()}">0</td>
                    <td class="text-end text-nowrap">
                        <a class="btn btn-sm btn-outline-secondary"
                           th:href="@{/entreprises/{id}/edit(id=${e.id})}">Modifier</a>
                        <form class="d-inline" method="post"
                              th:action="@{/entreprises/{id}/delete(id=${e.id})}"
                              onsubmit="return confirm('Supprimer cette entreprise ?');">
                            <button class="btn btn-sm btn-outline-danger">Supprimer</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(entreprises)}">
                    <td colspan="7" class="text-center text-muted py-4">Aucune entreprise trouvee.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
</body>
</html>
