<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}"
      lang="fr">
<head>
    <title>Espace etudiant</title>
</head>
<body>
<div layout:fragment="content">

    <div class="mb-4">
        <span class="badge text-bg-success mb-1">Espace etudiant</span>
        <h1 class="h3 mb-1">Choisir un etudiant</h1>
        <p class="text-muted mb-0">
            Selectionnez votre profil pour consulter votre stage et declarer votre avancement.
        </p>
    </div>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Etudiant</th>
                    <th>Filiere / niveau</th>
                    <th>Stage</th>
                    <th>Entreprise</th>
                    <th class="text-end">Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="e : ${etudiants}">
                    <td th:text="${e.nomComplet}">Etudiant</td>
                    <td th:text="|${e.filiere} / ${e.niveau}|">Filiere / niveau</td>
                    <td>
                        <span th:if="${e.stage != null}" th:text="${e.stage.sujet}">Stage</span>
                        <span th:if="${e.stage == null}" class="text-muted">Aucun stage</span>
                    </td>
                    <td th:text="${e.stage != null ? e.stage.entreprise.raisonSociale : '-'}">Entreprise</td>
                    <td class="text-end">
                        <a class="btn btn-sm btn-success"
                           th:href="@{/etudiants/{id}(id=${e.id})}">Ouvrir mon espace</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(etudiants)}">
                    <td colspan="5" class="text-center text-muted py-4">Aucun etudiant enregistre.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="mt-3">
        <a class="btn btn-outline-secondary btn-sm" th:href="@{/}">Retour a l'accueil</a>
    </div>

</div>
</body>
</html>
