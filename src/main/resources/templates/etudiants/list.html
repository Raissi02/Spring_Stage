<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}"
      lang="fr">
<head>
    <title>Etudiants</title>
</head>
<body>
<div layout:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Etudiants</h1>
        <a class="btn btn-primary" th:href="@{/etudiants/new}">Nouvel etudiant</a>
    </div>

    <form class="row g-2 mb-3" method="get" th:action="@{/etudiants}">
        <div class="col-sm-5 col-md-4">
            <input class="form-control" type="text" name="motCle" th:value="${motCle}"
                   placeholder="Nom, prenom ou numero">
        </div>
        <div class="col-auto">
            <button class="btn btn-outline-secondary">Rechercher</button>
        </div>
    </form>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Etudiant</th>
                    <th>Email</th>
                    <th>Numero</th>
                    <th>Filiere / niveau</th>
                    <th>Encadrant</th>
                    <th>Stage</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="e : ${etudiants}">
                    <td><a th:href="@{/etudiants/{id}(id=${e.id})}" th:text="${e.nomComplet}">Nom</a></td>
                    <td th:text="${e.email}">email</td>
                    <td th:text="${e.numeroEtudiant}">000</td>
                    <td>
                        <span th:text="${e.filiere}">Filiere</span>
                        <span class="text-muted" th:if="${e.niveau}" th:text="| / ${e.niveau}|"></span>
                    </td>
                    <td>
                        <a th:if="${e.encadrant != null}"
                           th:href="@{/enseignants/{id}(id=${e.encadrant.id})}"
                           th:text="${e.encadrant.nomComplet}">Encadrant</a>
                        <span th:if="${e.encadrant == null}" class="text-muted">Non affecte</span>
                    </td>
                    <td>
                        <a th:if="${e.stage != null}"
                           th:href="@{/stages/{id}(id=${e.stage.id})}"
                           th:text="${e.stage.sujet}">Stage</a>
                        <span th:if="${e.stage == null}" class="text-muted">&mdash;</span>
                    </td>
                    <td class="text-end text-nowrap">
                        <a class="btn btn-sm btn-outline-secondary"
                           th:href="@{/etudiants/{id}/edit(id=${e.id})}">Modifier</a>
                        <form class="d-inline" method="post"
                              th:action="@{/etudiants/{id}/delete(id=${e.id})}"
                              onsubmit="return confirm('Supprimer cet etudiant ?');">
                            <button class="btn btn-sm btn-outline-danger">Supprimer</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(etudiants)}">
                    <td colspan="7" class="text-center text-muted py-4">Aucun etudiant trouve.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
</body>
</html>
