<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Erreur</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="card shadow-sm mx-auto" style="max-width: 640px;">
        <div class="card-body p-4">
            <h1 class="h4 mb-3">Une erreur est survenue</h1>
            <p class="mb-2" th:text="|Code : ${status} - ${error}|">Code : 500</p>
            <p class="text-muted" th:if="${message}" th:text="${message}"></p>
            <a class="btn btn-primary mt-2" th:href="@{/}">Retour a l'accueil</a>
        </div>
    </div>
</div>
</body>
</html>
