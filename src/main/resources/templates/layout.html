<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gestion des stages</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-semibold" th:href="@{/}">Stages IIT</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#menuPrincipal" aria-controls="menuPrincipal"
                aria-expanded="false" aria-label="Basculer la navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/}">Accueil</a></li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" role="button"
                       data-bs-toggle="dropdown" aria-expanded="false">Administration</a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" th:href="@{/admin}">Tableau de bord</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" th:href="@{/etudiants}">Etudiants</a></li>
                        <li><a class="dropdown-item" th:href="@{/enseignants}">Enseignants</a></li>
                        <li><a class="dropdown-item" th:href="@{/entreprises}">Entreprises</a></li>
                        <li><a class="dropdown-item" th:href="@{/stages}">Stages</a></li>
                    </ul>
                </li>
                <li class="nav-item"><a class="nav-link" th:href="@{/enseignant}">Espace enseignant</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/etudiant}">Espace etudiant</a></li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/csr/index.html}" target="_blank">Interface CSR</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main class="container pb-5 flex-fill">
    <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${message}">OK</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fermer"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}">Erreur</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fermer"></button>
    </div>

    <section layout:fragment="content"></section>
</main>

<footer class="border-top py-3 text-center text-muted small bg-white">
    Mini-projet Spring Boot &mdash; Gestion des stages et du suivi des etudiants (IIT)
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
