spring.application.name=stage-management

# =====================================================================
# Base de donnees : MySQL / MariaDB (XAMPP)
#
# 1. Demarrer MySQL depuis XAMPP :
#      D:\xampp\xampp-control.exe   (bouton Start du module MySQL)
#      ou D:\xampp\mysql_start.bat
# 2. Lancer l'application :
#      mvn spring-boot:run
#
# XAMPP fournit MariaDB, compatible avec le driver MySQL Connector/J.
# La base "springJpaStages" est creee automatiquement si elle n'existe pas.
# =====================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/springJpaStages?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate detecte automatiquement MySQL / MariaDB.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Necessaire pour l'affichage des collections LAZY dans les vues Thymeleaf.
spring.jpa.open-in-view=true

# Rechargement des vues sans redemarrage (devtools).
spring.thymeleaf.cache=false

server.port=8080
