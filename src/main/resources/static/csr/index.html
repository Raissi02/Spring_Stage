<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Interface CSR - Gestion des stages</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
        <span class="navbar-brand fw-semibold">Interface CSR &mdash; REST + JavaScript</span>
        <a class="btn btn-outline-light btn-sm" href="/">Retour a l'interface SSR</a>
    </div>
</nav>

<div class="container pb-5">

    <div id="alert" class="alert d-none" role="alert"></div>

    <div class="row g-3 mb-4" id="stats"></div>

    <div class="row g-4">
        <div class="col-lg-5">
            <div class="card shadow-sm">
                <div class="card-header bg-white fw-semibold">Nouvel etudiant (POST /api/etudiants)</div>
                <div class="card-body">
                    <form id="formEtudiant">
                        <div class="row g-2">
                            <div class="col-6">
                                <label class="form-label small">Nom</label>
                                <input class="form-control" name="nom" required>
                            </div>
                            <div class="col-6">
                                <label class="form-label small">Prenom</label>
                                <input class="form-control" name="prenom" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label small">Email</label>
                                <input class="form-control" type="email" name="email" required>
                            </div>
                            <div class="col-6">
                                <label class="form-label small">Numero etudiant</label>
                                <input class="form-control" name="numeroEtudiant">
                            </div>
                            <div class="col-6">
                                <label class="form-label small">Filiere</label>
                                <input class="form-control" name="filiere">
                            </div>
                        </div>
                        <button class="btn btn-primary w-100 mt-3" type="submit">Creer l'etudiant</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-lg-7">
            <div class="card shadow-sm mb-4">
                <div class="card-header bg-white d-flex justify-content-between align-items-center">
                    <span class="fw-semibold">Etudiants (GET /api/etudiants)</span>
                    <button class="btn btn-sm btn-outline-secondary" id="btnRefresh">Rafraichir</button>
                </div>
                <div class="table-responsive">
                    <table class="table table-sm table-hover mb-0">
                        <thead class="table-light">
                        <tr><th>#</th><th>Etudiant</th><th>Email</th><th>Encadrant</th><th>Stage</th></tr>
                        </thead>
                        <tbody id="tbodyEtudiants"></tbody>
                    </table>
                </div>
            </div>

            <div class="card shadow-sm">
                <div class="card-header bg-white fw-semibold">Stages (GET /api/stages)</div>
                <div class="table-responsive">
                    <table class="table table-sm mb-0">
                        <thead class="table-light">
                        <tr><th>Sujet</th><th>Entreprise</th><th>Etudiant</th><th>Statut</th></tr>
                        </thead>
                        <tbody id="tbodyStages"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const ALERT = document.getElementById('alert');

    function afficherAlerte(message, type) {
        ALERT.className = 'alert alert-' + type;
        ALERT.textContent = message;
        setTimeout(() => ALERT.classList.add('d-none'), 5000);
    }

    function badgeStatut(statut) {
        const couleurs = {
            EN_ATTENTE: 'warning text-dark',
            EN_COURS: 'primary',
            TERMINE: 'secondary',
            VALIDE: 'success'
        };
        return '<span class="badge text-bg-' + (couleurs[statut] || 'secondary') + '">'
            + statut + '</span>';
    }

    async function chargerDonnees() {
        try {
            const reponses = await Promise.all([
                fetch('/api/statistiques'),
                fetch('/api/etudiants'),
                fetch('/api/stages')
            ]);
            reponses.forEach(r => {
                if (!r.ok) {
                    throw new Error('HTTP ' + r.status);
                }
            });
            const stats = await reponses[0].json();
            const etudiants = await reponses[1].json();
            const stages = await reponses[2].json();

            document.getElementById('stats').innerHTML = [
                ['Etudiants', stats.totalEtudiants],
                ['Enseignants', stats.totalEnseignants],
                ['Entreprises', stats.totalEntreprises],
                ['Stages', stats.totalStages]
            ].map(([libelle, valeur]) => `
                <div class="col-6 col-md-3">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <div class="text-muted small text-uppercase">${libelle}</div>
                            <div class="fs-3 fw-semibold">${valeur}</div>
                        </div>
                    </div>
                </div>`).join('');

            document.getElementById('tbodyEtudiants').innerHTML = etudiants.length === 0
                ? '<tr><td colspan="5" class="text-center text-muted py-3">Aucun etudiant.</td></tr>'
                : etudiants.map(e => `
                    <tr>
                        <td>${e.id}</td>
                        <td>${e.prenom} ${e.nom}</td>
                        <td>${e.email}</td>
                        <td>${e.encadrantNomComplet || '-'}</td>
                        <td>${e.stageId ? '#' + e.stageId : '-'}</td>
                    </tr>`).join('');

            document.getElementById('tbodyStages').innerHTML = stages.length === 0
                ? '<tr><td colspan="4" class="text-center text-muted py-3">Aucun stage.</td></tr>'
                : stages.map(s => `
                    <tr>
                        <td>${s.sujet}</td>
                        <td>${s.entrepriseNom || '-'}</td>
                        <td>${s.etudiantNomComplet || '-'}</td>
                        <td>${badgeStatut(s.statut)}</td>
                    </tr>`).join('');
        } catch (e) {
            afficherAlerte('Chargement impossible : ' + e.message, 'danger');
        }
    }

    document.getElementById('formEtudiant').addEventListener('submit', async (evenement) => {
        evenement.preventDefault();
        const donnees = Object.fromEntries(new FormData(evenement.target).entries());
        try {
            const reponse = await fetch('/api/etudiants', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(donnees)
            });
            if (!reponse.ok) {
                const probleme = await reponse.json().catch(() => ({}));
                const details = probleme.erreurs
                    ? Object.values(probleme.erreurs).join(', ')
                    : (probleme.detail || 'HTTP ' + reponse.status);
                throw new Error(details);
            }
            evenement.target.reset();
            afficherAlerte('Etudiant cree avec succes.', 'success');
            chargerDonnees();
        } catch (e) {
            afficherAlerte('Creation impossible : ' + e.message, 'danger');
        }
    });

    document.getElementById('btnRefresh').addEventListener('click', chargerDonnees);

    chargerDonnees();
</script>
</body>
</html>
